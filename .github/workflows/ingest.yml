name: ingest

# Data ingestion, split into two cadences while we finish the initial backfill:
#
#   • every 2h  (even hours)  → crawl + enrich
#       These advance incrementally: the crawl resumes from its checkpoint and
#       processes only NEW GitHub configs (discovering servers from real usage),
#       and enrich fills in thin stubs `enrichLimit` at a time. Repeating them
#       is productive, not redundant.
#
#   • daily 07:00 UTC → seed + snapshot
#       The seed has no cursor — one run exhausts the fixed query lists, so
#       running it more often just re-fetches the same set (wasted quota). Once
#       a day catches newly-published packages. Snapshot writes one
#       adoption_snapshots row per run, so it MUST stay daily or it corrupts the
#       trend sparkline. 07:00 is an odd hour so it never collides with the 2h
#       slot (which fires on even hours).
#
# When catalog growth flattens (ingest_runs server delta ≈ 0 for a couple of
# days — check `npm run ingest -- config`), collapse this back to a single daily
# run: delete the "0 */2 * * *" schedule and switch the daily one to all phases.

on:
  schedule:
    - cron: "0 */2 * * *" # every 2h (even hours) → crawl + enrich
    - cron: "0 7 * * *" # daily 07:00 UTC → seed + snapshot
  workflow_dispatch: # manual runs from the Actions tab
    inputs:
      phases:
        description: "Phases to run (comma list: seed,crawl,enrich,snapshot). Blank = crawl,enrich."
        required: false
        default: ""
      config:
        description: "Optional one-time config set, e.g. 'seedGithubPages 20'. Blank = skip."
        required: false
        default: ""

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 110 # < 120 so a slow run can't stack onto the next 2h slot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Persist the crawl checkpoint between runs so each crawl only processes
      # newly-found configs instead of re-fetching everything.
      - name: Restore crawl checkpoint
        uses: actions/cache@v4
        with:
          path: .crawl-state.json
          key: crawl-state-${{ github.run_id }}
          restore-keys: |
            crawl-state-

      # Map the trigger to a phase set.
      #   manual + phases input → that list
      #   daily (07:00)         → seed,snapshot
      #   2h slot / manual blank→ crawl,enrich
      - name: Select phases
        id: sel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.phases }}" ]; then
            echo "only=${{ inputs.phases }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 7 * * *" ]; then
            echo "only=seed,snapshot" >> "$GITHUB_OUTPUT"
          else
            echo "only=crawl,enrich" >> "$GITHUB_OUTPUT"
          fi

      # Optional one-time knob change from the Actions tab (no local run needed).
      - name: Apply config (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.config != '' }}
        run: npm run ingest -- set ${{ inputs.config }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Ingest (${{ steps.sel.outputs.only }})
        run: npm run ingest -- --only ${{ steps.sel.outputs.only }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.INGEST_GH_TOKEN }}

      # Flush the read-path cache so new counts show immediately.
      - name: Revalidate site cache
        if: always()
        continue-on-error: true
        run: |
          if [ -n "${SITE_URL}" ] && [ -n "${REVALIDATE_SECRET}" ]; then
            curl -fsS -X POST "${SITE_URL}/api/revalidate" \
              -H "x-revalidate-secret: ${REVALIDATE_SECRET}" || true
          else
            echo "SITE_URL / REVALIDATE_SECRET not set — skipping cache flush."
          fi
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
