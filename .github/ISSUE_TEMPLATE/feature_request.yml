name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what's missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Rough is fine.
  - type: dropdown
    id: audience
    attributes:
      label: Who is this for?
      options:
        - Server authors / vendors
        - Teams adopting MCP
        - Platform / security teams
        - Market intelligence / data consumers
        - Contributors / self-hosters
        - Other
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: |
        Alternatives considered, prior art, or constraints. Note: the project
        reports observations, never verdicts (no "verified/safe/trusted"), and
        never stores secrets, paths, or user identity — keep proposals within
        those invariants where relevant.
